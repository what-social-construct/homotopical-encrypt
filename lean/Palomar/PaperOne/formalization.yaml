    location: "Sections 2, 3.2--3.5 and the correspondence appendix; groups P1-S01--S06 and P1-B01 in the entry README."
    relationship: "formalizes"
    note: >-
      Source for the seven retained Hodge/CVP and exact-component groups.
      The reduced entry preserves each remaining selected statement type and
