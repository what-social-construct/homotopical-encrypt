version: "v0.4"

project:
  name: "Hidden Hodge Targets and Discrete Closest Vectors"
  description: >-
    We formalize finite real Hodge decomposition with unique components,
    private harmonic and presented-coefficient recovery, and the exact
    preservation of discrete closest-vector answers by projection onto a
    subspace containing the supplied lattice. In the declared algebraic finite
    signed-incidence cellular model, integral examples have equal
    cohomological public observations but distinct
    nonzero operative harmonic targets; a weighted example gives different
    integer coefficients at the same input. Under closed-test invariance and
    an optional reflection condition, public fibers are exactly the declared
    typed homotopy classes; the admitted cellular family proves that condition. The general oracle statements
    retain their invariance, separation and correct-oracle existence
    hypotheses. A derived corollary fixes the same correct rank-one oracle:
    the supplied operative lattice yields its unique answer, while a shared
    public class and cochain do not select the hidden member's answer.
    An additional result shows an exact-component observation obstruction.
    These are exact mathematical comparison and recovery results; no
    asymptotic hardness or cryptographic security claim is made.
  authors:
    - "Chloe van der Vlugt"
  responsible_maintainers:
    - "Chloe van der Vlugt"
  license: "MIT"

