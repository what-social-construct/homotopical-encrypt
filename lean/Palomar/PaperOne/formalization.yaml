    object definitions and proof adapters with the canonical implementation
    and manuscript. The README supplies the seven-group crosswalk. This
    records agent review, not independent human review or registry endorsement.
    Entry-specific local Comparator and kernel checks and the earlier public
    snapshot's protected preflight pass as recorded above. The revised
    manuscript/metadata candidate requires a fresh exact-commit protected run;
    the old report does not certify new informal material.

