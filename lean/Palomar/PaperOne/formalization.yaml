      Paper 3.
  - title: "First-order homotopical logic"
    authors:
      - "Joseph Helfer"
    type: "paper"
    id: "https://doi.org/10.1017/jsl.2023.68"
    location: "Homotopy-invariant interpretation and closed-formula semantics; arXiv:1908.08944v2."
    relationship: "background"
    note: >-
      Provides the semantic framework motivating the typed interpretation and
      invariance interface. The constructed family uses the stated
      nonzero-cohomology-test fragment in the real cochain model. The entry
      does not formalize Helfer's complete first-order syntax or general
      fibrational invariance theorem.
  - title: "Toward a Spectral Theory of Cellular Sheaves"
    authors:
      - "Jakob Hansen"
      - "Robert Ghrist"
    type: "paper"
    id: "https://arxiv.org/abs/1808.01513v2"
    location: "Sections 2--3: cellular cochains, coboundaries and Hodge theory."
    relationship: "adapts"
    note: >-
      The finite coordinate cellular model uses incidence-weighted stalk
      restriction maps and the actual adjoint Hodge operator. This adapts
      that mathematical setup for the declared finite real model; it is not
      a formalization of the whole paper.

status:
  scope: >-
    One entry covers the manuscript's seven Hodge/CVP and exact-component groups
    through 18 manuscript-facing theorem declarations and 20 supporting
    declarations selected by
    comparator.json. Challenge imports only Mathlib and gives transparent
    ordinary definitions of the mathematical objects. Solution identifies
    those presentations with the canonical cellular, Hodge, lattice,
    and semantic objects through proof adapters. Two pure
    finite-product helpers retain their canonical HomotopicalEncryption.Helfer names in
    the independent Challenge. There are no definition holes. This directory
    belongs to the substantive development, rather than a separately pinned
    wrapper repository. The revised manuscript has one post-conclusion parity table for canonical
    definitions, selected results/support and explicit assumptions/contracts.
    The mathematical body contains no implementation-name lists, and no
    repository-wide protocol/coding catalogue is included. The exact-component
    obstruction remains in Paper 1. Concrete protocol visibility is developed
    in Paper 2; the projective projection chain and quantitative proximity
    analysis belong to Paper 3.
