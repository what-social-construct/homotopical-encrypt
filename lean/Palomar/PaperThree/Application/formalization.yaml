    unchanged original context, layout, maps and metrics; Solution reuses
    the existing CanonicalCalibration proof owners. Definitions remain ordinary
    and transparent.
    The configured inventory is ten manuscript-facing and twelve supporting
    declarations. Both modules build; comparison and dependency verification
    are recorded separately. This directory belongs to the substantive development.
