version: "v0.4"

project:
  name: "Original Cochain Payloads and Native Modular Proximity"
  description: >-
    We formalize a modular proximity profile on the original cochain payload
    and storage context. Intrinsic source validity is an actual integral
    cellular coboundary modulo a carry, equivalent to the paired Reed–Solomon
    valid locus. Independently defined cochain, pair and extracted-code
    distances satisfy d_C <= d_P = D_RS <= 2*d_C. Existing application
    interfaces read the original extracted pair, transfer farness at unit
    scale and use explicit factor-two near scaling. The actual modulus-12289
    serializer admits a raw well-formed capacity-far payload with all three
    distances 3/4 and a proved restricted diagonal challenge profile; accepted
    exact anchors instead have zero native distance under the stated decoder
    contract. A companion coding entry retains the pure-code sharpness and
    fixed-mix obstruction. The selected profile does not supply a full-HCP
    geometric comparison or cryptographic security statement.
  authors:
    - "Chloe van der Vlugt"
  responsible_maintainers:
    - "Chloe van der Vlugt"
  license: "MIT"

classification:
  arxiv: ["cs.IT", "math.AT"]
  msc2020: ["94B05", "94B35"]

sources:
  - title: "Capacity-Radius Proximity for Smooth-Domain Reed–Solomon Codes"
    authors:
      - "Chloe van der Vlugt"
    type: "paper"
    id: "https://github.com/what-social-construct/homotopical-encrypt/blob/1a2f72a1a60056ac001716c95c403816f9069ee0/papers/proximity-prize/main.tex"
    location: "Section 7; P3-A01, the storage-calibration portion of P3-A02 and P3-A03."
    relationship: "formalizes"
    note: >-
      Immutable manuscript source. Paper 2 owns the shared cochain construction,
      codec/visibility and gate/evidence contracts; Paper 3 owns their quantitative
      coding and metric/radius analysis. The companion coding configuration retains
      all nine original coding groups, the spectrum/distance interpretation,
      pure-code factor-two sharpness and the fixed-mix limitation. Splitting
      the independently stated Challenges preserves the selected scope under
      the 1000-line Challenge limit.

