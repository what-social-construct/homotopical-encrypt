        implementation, source comparison, metadata and documentation.
      prompting_notes: >-
        The author directed the mathematical scope and reuse of the actual
        cochain, storage and projection objects. Agents prepared independent
        canonical definitions, statement selections and manuscript crosswalks.
        Exact model identifiers were not recorded. Local verification is recorded above; protected Linux verification
        remains pending.

fidelity:
  divergences: >-
    Generic modular results retain a prime field, declared information set,
    complete coordinate layout and their degree/length hypotheses. Actual wire
    serialization is the canonical modulus-12289 specialization. All three
    native metric normalizations and both comparison directions are explicit.
    Raw capacity-far payloads are rejection inputs; accepted exact anchors have
    zero native distance only under the declared realization/decoder contract.
    Diagonal challenge goodness is a restricted-line result and does not
    establish uniform preservation for an arbitrary fixed mix. The three application
    wrappers unfold facade types without changing the actual carrier, maps
    or metrics. The source profile does not identify modular validity with unrestricted real Hodge
    exactness or prove a capacity-scale Euclidean/full-HCP comparison.
    Authentication, visibility, transcript binding, runtime refinement and
    cryptographic or efficiency advantages are outside these conclusions.

review:
  status: "not-reviewed"
  notes: >-
    Agent source/statement review and local proof comparison are complete; protected Linux verification remains pending.
    This records preparation rather than external human or registry review.

