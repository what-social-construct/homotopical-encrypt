    - declaration: "HomotopicalEncryption.Protocol.Storage.ThreeLevel.three_native_distance_comparison"
    - declaration: "HomotopicalEncryption.Protocol.Storage.ThreeLevel.flatDistance_eq_rsFlatDistance"
    - declaration: "HomotopicalEncryption.Palomar.PaperThree.Application.calibration_extract_eq_original_pair_unfolded"
    - declaration: "HomotopicalEncryption.Palomar.PaperThree.Application.sourceFar_implies_rsFar_unfolded"
    - declaration: "HomotopicalEncryption.Palomar.PaperThree.Application.planeNear_of_scaledSourceNear_unfolded"
