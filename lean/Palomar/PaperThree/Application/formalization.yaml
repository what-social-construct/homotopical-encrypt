    entry_axiom_audit: "Passed all 22 configured declarations: 21 exact-three and 1 standard subset. Fresh combined probe: 975 standard-only reports; all 975 pre-revision sets unchanged. Expanded documentation-revision build: 9295 jobs."
    local_comparator: "Passed statement/definition comparison, Lean default kernel and NanoDa; macOS diagnostic with --inadvisably-no-sandbox."
    protected_linux_verification: "Pending; not run."
    note: >-
      Intentional Challenge theorem placeholders are comparison targets.
      Existing canonical proofs are separate evidence. No metadata-schema
      validation, protected preflight, registry review or submission is claimed.
  main_results:
