        inverse-law wrappers and manuscript crosswalks. Exact model identifiers
        were not recorded. Local verification is recorded above; protected Linux verification remains pending.

fidelity:
  divergences: >-
    List statements retain positive interleaving width and their exact degree,
    length and budget hypotheses. The endpoint-safe regime has a nonattained
    real supremum; the middle regime's optimal smaller radius remains open.
    The explicit Galois-field family and boundary prime are distinct from the
    companion's modulus-12289 wire application. MCA fixes the affine line
    before sampling the challenge. The 128-bit claim is a fractional
    bad-challenge bound. These statements do not prove a cryptographic game,
    bind a transcript, identify an unrestricted Hodge metric or establish a
    novelty or efficiency advantage. Companion application claims are retained
    under a separate configuration rather than weakened to a generic premise.

review:
