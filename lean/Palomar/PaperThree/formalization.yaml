version: "v0.4"

project:
  name: "Capacity-Radius Reed–Solomon List and Same-Set MCA Bounds"
  description: >-
    We formalize the exact capacity-grid list size choose(n,k), an explicit next-shell
    lower bound and the three fractional-budget regimes for interleaved
    Reed–Solomon codes. A same-set mutual-correlated-agreement certificate
    gives bad-challenge count at most choose(n,k+1) for every fixed line and real radius.
    An actual family over GaloisField(3,256*2^u) meets the stated 128-bit
    fraction targets; a separate certified prime-field instance has exact
    greatest-safe and first-unsafe counts zero and one and real safe interval
    [0,1/4096). The entry also gives the exact spectrum-budget interpretation,
    attained-distance transfer, sharp factor-two pair/scalar comparison and
    fixed-mix cancellation limitation. A companion entry retains the original
    cochain-storage application from the same manuscript. These are coding
    and distance statements, without a cryptographic or efficiency claim.
  authors:
    - "Chloe van der Vlugt"
  responsible_maintainers:
    - "Chloe van der Vlugt"
  license: "MIT"

classification:
  arxiv: ["cs.IT"]
  msc2020: ["94B05", "94B35"]

