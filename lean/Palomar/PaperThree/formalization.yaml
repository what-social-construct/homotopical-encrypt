    type: "paper"
    id: "https://github.com/what-social-construct/homotopical-encrypt/blob/1a2f72a1a60056ac001716c95c403816f9069ee0/papers/proximity-prize/main.tex"
    location: "Sections 3--6 and the pure coding sharpness/fixed-mix results of Section 7; P3-S01--S09, P3-B01, the coding portion of P3-A02 and P3-A04."
    relationship: "formalizes"
    note: >-
      Immutable manuscript source. Paper 2 owns the shared cochain construction,
      codec/visibility and gate/evidence contracts; Paper 3 owns their quantitative
      coding and metric/radius analysis. The independent entry retains the complete
      selected coding claims. The separately configured application companion
      retains P3-A01, the storage-calibration portion of P3-A02 and P3-A03.
      Both configurations belong to one Paper 3 scope, split to respect the
      independent Challenge size limit.

