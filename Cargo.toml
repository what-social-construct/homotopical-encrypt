[workspace]
resolver = "2"
members = [
    "rust/node",
    "rust/oracle",
    "rust/wallet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Homotopical Encrypt Contributors"]
license = "MIT"
repository = "https://github.com/what-social-construct/homotopical-encrypt"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Networking
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "mdns", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ed25519-dalek = "2.1"
sha2 = "0.10"
blake3 = "1.5"
zeroize = { version = "1.7", features = ["derive"] }

# Database
rocksdb = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
bytes = "1.5"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }

# WASM (for smart contracts)
wasmtime = "16.0"

# Testing
proptest = "1.4"
criterion = "0.5"
